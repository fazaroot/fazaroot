<svg width="480" height="260" viewBox="0 0 480 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A2BE2"/>
      <stop offset="100%" stop-color="#00FF9C"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FF9C" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00FF9C" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00FF9C" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame">
      <rect x="0" y="0" width="480" height="260" rx="10"/>
    </clipPath>
  </defs>

  <!-- terminal frame -->
  <rect x="0" y="0" width="480" height="260" rx="10" fill="#0d1117" stroke="#8A2BE2" stroke-width="1.5"/>
  <rect x="0" y="0" width="480" height="24" rx="10" fill="#161b22"/>
  <circle cx="16" cy="12" r="5" fill="#ff5f56"/>
  <circle cx="34" cy="12" r="5" fill="#ffbd2e"/>
  <circle cx="52" cy="12" r="5" fill="#27c93f"/>
  <text x="240" y="16" font-family="Fira Code, monospace" font-size="11" fill="#8b949e" text-anchor="middle">faza@kali: ~/skills --scan</text>

  <g clip-path="url(#frame)">
    <!-- moving matrix scanline, loops top to bottom -->
    <rect x="0" y="-40" width="480" height="40" fill="url(#scanGrad)">
      <animate attributeName="y" values="-40;260" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- skill rows: label, track, animated bar, percentage -->
  <g font-family="Fira Code, Courier New, monospace" font-size="12" fill="#c9d1d9">

    <text x="20" y="55">Recon &amp; OSINT</text>
    <rect x="20" y="62" width="300" height="10" rx="5" fill="#161b22" stroke="#30363d"/>
    <rect x="20" y="62" height="10" rx="5" fill="url(#barGrad)" filter="url(#glow2)" width="0">
      <animate attributeName="width" values="0;255;255;0" keyTimes="0;0.35;0.85;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="330" y="70" fill="#00FF9C">85%</text>

    <text x="20" y="95">Web App Pentest</text>
    <rect x="20" y="102" width="300" height="10" rx="5" fill="#161b22" stroke="#30363d"/>
    <rect x="20" y="102" height="10" rx="5" fill="url(#barGrad)" filter="url(#glow2)" width="0">
      <animate attributeName="width" values="0;225;225;0" keyTimes="0;0.40;0.85;1" dur="6s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <text x="330" y="110" fill="#00FF9C">75%</text>

    <text x="20" y="135">Static Code Review</text>
    <rect x="20" y="142" width="300" height="10" rx="5" fill="#161b22" stroke="#30363d"/>
    <rect x="20" y="142" height="10" rx="5" fill="url(#barGrad)" filter="url(#glow2)" width="0">
      <animate attributeName="width" values="0;270;270;0" keyTimes="0;0.45;0.85;1" dur="6s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <text x="330" y="150" fill="#00FF9C">90%</text>

    <text x="20" y="175">Automation (Py/JS)</text>
    <rect x="20" y="182" width="300" height="10" rx="5" fill="#161b22" stroke="#30363d"/>
    <rect x="20" y="182" height="10" rx="5" fill="url(#barGrad)" filter="url(#glow2)" width="0">
      <animate attributeName="width" values="0;195;195;0" keyTimes="0;0.50;0.85;1" dur="6s" begin="0.9s" repeatCount="indefinite"/>
    </rect>
    <text x="330" y="190" fill="#00FF9C">65%</text>

    <text x="20" y="215">Responsible Disclosure</text>
    <rect x="20" y="222" width="300" height="10" rx="5" fill="#161b22" stroke="#30363d"/>
    <rect x="20" y="222" height="10" rx="5" fill="url(#barGrad)" filter="url(#glow2)" width="0">
      <animate attributeName="width" values="0;240;240;0" keyTimes="0;0.55;0.85;1" dur="6s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <text x="330" y="230" fill="#00FF9C">80%</text>
  </g>

  <!-- blinking status dot -->
  <circle cx="460" cy="12" r="4" fill="#27c93f">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
</svg>
